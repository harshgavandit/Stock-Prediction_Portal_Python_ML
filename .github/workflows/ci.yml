name: Verify application
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-synthetic-secret-with-at-least-fifty-characters-123456
      DEBUG: "False"
      MPLCONFIGDIR: /tmp/matplotlib
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python backend-drf/manage.py check
      - run: python backend-drf/manage.py makemigrations --check --dry-run
      - run: python backend-drf/manage.py test accounts.tests api.tests --verbosity 2
      - run: npm --prefix frontend-react ci
      - run: npm --prefix frontend-react run lint
      - run: npm --prefix frontend-react audit --audit-level=moderate
      - run: npm --prefix frontend-react run build
